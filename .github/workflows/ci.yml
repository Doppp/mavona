name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.6
          bundler-cache: false
      - run: bun install --frozen-lockfile
      - name: Provision explicit fixture and browser test dependencies
        run: |
          bundle install --gemfile fixtures/rails-dogfood/Gemfile
          bun node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - run: ruby fixtures/rails-dogfood/bin/check
      - run: bun run typecheck
      - run: bun test
      - run: bun scripts/rails-browser-acceptance.ts
      - run: bun run build
      - run: env -i PATH=/usr/bin:/bin ./dist/mavona --version
      - run: MAVONA_TEST_BINARY="$PWD/dist/mavona" bun test tests/cli.test.ts tests/session-cli.test.ts tests/inspection-cli.test.ts
      - run: bun build --compile scripts/source-highlighting-spike.ts --outfile dist/highlighting-spike
      - run: env -i PATH=/usr/bin:/bin ./dist/highlighting-spike
      - run: python3 scripts/pty-source.py dist/mavona
      - run: python3 scripts/pty-smoke.py dist/mavona
      - run: python3 scripts/pty-editor.py dist/mavona
      - run: python3 scripts/pty-editor.py dist/mavona --cancel

  ruby-characterization:
    # Retain the historical oracle without restoring a competing application tree.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.6
          bundler-cache: false
      - name: Extract immutable baseline outside checkout
        run: |
          mkdir "$RUNNER_TEMP/mavona-ruby-baseline"
          git archive fdee1136acd7863885ed20c6760f61674f7e32c5 | tar -x -C "$RUNNER_TEMP/mavona-ruby-baseline"
      - name: Run historical deterministic suite
        run: |
          cd "$RUNNER_TEMP/mavona-ruby-baseline"
          bundle install
          MAVONA_BENCHMARK=0 bundle exec rake test
